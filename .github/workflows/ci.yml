name: CI

# No branch filters. Gating on [main] meant PHP was only ever linted *after*
# merge: pull_request runs had fired exactly twice in the repo's history, both
# from Dependabot, so every hand-authored change reached main unlinted. Running
# on every push and every pull request is what makes this a gate rather than a
# post-mortem.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
      - name: Lint PHP files
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The version bump decides what reaches every existing install, and it
      # only ever runs on the promotion path — test it before it gets there.
      - name: Test the version bump
        run: python3 -m unittest discover -s .github/scripts -v
